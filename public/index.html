<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Paraíso - Menú Digital</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Encabezado para Cliente -->
    <nav class="top-nav">
        <div style="color: white; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-mug-hot" style="color: var(--primary-orange);"></i> Café Paraíso
        </div>
        <div id="mesaInfoBadge" style="background: rgba(255,255,255,0.15); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem;">
            Mesa: --
        </div>
    </nav>

    <!-- Botón Destacado de Ver Pedido -->
    <div class="hero-action-bar">
        <button class="btn-view-order" onclick="abrirCarrito()">
            <i class="fa-solid fa-cart-shopping"></i> Ver Pedido <span id="cartCountBadge" style="background:white; color:var(--primary-orange-dark); padding:2px 8px; border-radius:12px; font-size:0.9rem;">0</span>
        </button>
    </div>

    <!-- Categorías Tipo Pills -->
    <div class="categories-container" id="categoriesContainer">
        <button class="category-pill active" onclick="filtrarCategoria('todas')">Todos</button>
        <button class="category-pill" onclick="filtrarCategoria(1)">Cafés & Bebidas</button>
        <button class="category-pill" onclick="filtrarCategoria(2)">Acompañantes</button>
    </div>

    <!-- Grid de Productos -->
    <main class="products-grid" id="productsContainer">
        <!-- Se llena dinámicamente desde app.js -->
    </main>

    <script src="js/app.js"></script>
</body>
</html>
